[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nl-pandas-finetuning"
version = "0.1.0"
description = "Evaluate fine-tuning small language models for NL-to-pandas code generation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "faker>=30,<40",
    "pandas>=2.2,<4",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "pre-commit>=4,<5",
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]
tracking = [
    "dvc>=3,<4",
    "mlflow>=2,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]